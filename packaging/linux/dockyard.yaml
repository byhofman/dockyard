name: dockyard
arch: amd64
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Thomas Hofman <noreply@github.com>
description: |
  Dockyard: the dockyard command, which installs Docker CE on demand, starts and stops it and keeps it up to date, and the
  Dockyard tray. The dashboard is the dockyard-dashboard package.
homepage: https://github.com/byhofman/dockyard
license: MIT
contents:
  - src: dist/linux/cli/dockyard-cli
    dst: /usr/lib/dockyard/dockyard-cli
    file_info: { mode: 0755 }
  - src: /usr/lib/dockyard/dockyard-cli
    dst: /usr/bin/dockyard
    type: symlink
  - src: dist/linux/tray/dockyard-tray
    dst: /usr/lib/dockyard/dockyard-tray
    file_info: { mode: 0755 }
  # The tray's Skia and HarfBuzz; the dashboard package carries its own copies.
  - src: dist/linux/tray/libSkiaSharp.so
    dst: /usr/lib/dockyard/libSkiaSharp.so
  - src: dist/linux/tray/libHarfBuzzSharp.so
    dst: /usr/lib/dockyard/libHarfBuzzSharp.so
  - src: packaging/linux/dockyard.desktop
    dst: /usr/share/applications/dockyard.desktop
  - src: branding/app-icon/png/icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/dockyard.png
  - src: branding/app-icon/png/icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/dockyard.png
  - src: branding/app-icon/png/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/dockyard.png
  - src: branding/app-icon/png/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/dockyard.png
  - src: branding/app-icon/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dockyard.svg
scripts:
  postinstall: packaging/linux/postinstall.sh
