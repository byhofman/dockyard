name: build

# One workflow for every component, run by a release tag or by hand (which builds and tests everything); there is no CI
# on pull requests or main, by the owner's choice. A tag <component>/<version>
# builds, tests and releases only that component, and a tag v<version> releases all four at that version, in the order
# the index needs them. See docs/design/components-and-releases.md.
on:
  push:
    tags: ['cli/v*', 'tray/v*', 'dashboard/v*', 'engine/v*', 'v*']
  workflow_dispatch:
  # install-tests.yml builds a ref through this, and its jobs install what the build produced.
  workflow_call:

# Read only, except for the job that publishes the release.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.plan.outputs.component }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      cli: ${{ steps.plan.outputs.cli }}
      tray: ${{ steps.plan.outputs.tray }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      engine: ${{ steps.plan.outputs.engine }}
    steps:
      - id: plan
        run: |
          component=all; version=0.0.0
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:v[0-9]*) version="${GITHUB_REF_NAME#v}" ;;
            tag:*) component="${GITHUB_REF_NAME%%/*}"; version="${GITHUB_REF_NAME#*/v}" ;;
          esac
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          for c in cli tray dashboard engine; do
            if [ "$component" = all ] || [ "$component" = "$c" ]; then echo "$c=true"; else echo "$c=false"; fi >> "$GITHUB_OUTPUT"
          done

  # The agent and scripts for an engine that already exists; both apps embed them.
  guest:
    needs: [plan]
    if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh image/build.sh x86_64 guest guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest
          path: out/dockyard-guest-*.tar.gz

  windows:
    needs: [plan, guest]
    if: ${{ !cancelled() && (needs.plan.outputs.engine != 'true' || needs.plan.outputs.component == 'all') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.dashboard == 'true'
        with:
          name: guest
          path: guest

      - name: Test
        shell: pwsh
        run: dotnet test --solution Dockyard.slnx --filter-not-trait "Category=Install"

      - name: Host
        if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.dashboard == 'true'
        shell: pwsh
        run: dotnet publish src/Dockyard.Host/Dockyard.Host.csproj -c Release -r win-x64 -o out/host -p:Version=${{ needs.plan.outputs.version }} -warnaserror

      - name: CLI
        if: needs.plan.outputs.cli == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r win-x64 -o out/cli -p:Version=${{ needs.plan.outputs.version }} -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -p:HostExe="$PWD/out/host/dockyard-host.exe" -warnaserror
          Copy-Item out/cli/dockyard-cli.exe out/dockyard-windows-x64.exe

      # Also for a CLI release: the install tests install the tray from this build.
      - name: Tray
        if: needs.plan.outputs.tray == 'true' || needs.plan.outputs.cli == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Dockyard.Tray/Dockyard.Tray.csproj -c Release -r win-x64 -o out/tray -p:Version=${{ needs.plan.outputs.version }} -warnaserror
          # With Skia's native libraries: an AOT exe alone cannot draw its icon without the dashboard's copies next to it.
          Compress-Archive -Path out/tray/*.exe, out/tray/*.dll -DestinationPath out/Dockyard.Tray.zip

      # Also for a CLI release: the install tests install the dashboard from this build.
      - name: Dashboard
        if: needs.plan.outputs.dashboard == 'true' || needs.plan.outputs.cli == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r win-x64 -o out/dashboard -p:Version=${{ needs.plan.outputs.version }} -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -p:HostExe="$PWD/out/host/dockyard-host.exe" -warnaserror
          Compress-Archive -Path out/dashboard/*.exe, out/dashboard/*.dll -DestinationPath out/Dockyard.Dashboard.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          if-no-files-found: ignore
          path: |
            out/dockyard-windows-x64.exe
            out/Dockyard.Tray.zip
            out/Dockyard.Dashboard.zip

  linux:
    needs: [plan, guest]
    if: ${{ !cancelled() && (needs.plan.outputs.engine != 'true' || needs.plan.outputs.component == 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.cli == 'true' || needs.plan.outputs.dashboard == 'true'
        with:
          name: guest
          path: guest

      # The pinned kind, for the cluster tests on this runner's engine.
      - name: kind
        run: |
          kind_tag="v$(sed -n 's/^KIND=//p' image/versions.env)"
          url="https://github.com/kubernetes-sigs/kind/releases/download/$kind_tag/kind-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/kind" "$url"
          echo "$(awk -v u="$url" '$2 == u { print $1 }' image/versions.sha256)  $RUNNER_TEMP/kind" | sha256sum -c
          chmod +x "$RUNNER_TEMP/kind"

      - name: Test
        env:
          DOCKYARD_TEST_ENDPOINT: unix:///var/run/docker.sock
        run: DOCKYARD_TEST_KIND="$RUNNER_TEMP/kind" dotnet test --solution Dockyard.slnx --filter-not-trait "Category=Install"

      - name: Publish and package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CLI: ${{ needs.plan.outputs.cli }}
          DASHBOARD: ${{ needs.plan.outputs.dashboard }}
        run: |
          nfpm() {
            docker run --rm -v "$PWD:/work" -w /work -e VERSION="$VERSION" goreleaser/nfpm:v2.49.0@sha256:9ea46a59c4d055ef7071b22f3520b53e8dad98e18043b2f881b53bd7ffec634e \
              pkg --config "packaging/linux/$1.yaml" --packager "$2" --target out/
          }
          mkdir -p out
          # Each app has its own tray and libraries on Linux: a folder, a package and a tarball of its own.
          if [ "$CLI" = true ] || [ "$DASHBOARD" = true ]; then
            dotnet publish src/Dockyard.Tray/Dockyard.Tray.csproj -c Release -r linux-x64 -o dist/linux/tray -p:Version="$VERSION" -warnaserror
          fi
          if [ "$CLI" = true ]; then
            dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r linux-x64 -o dist/linux/cli -p:Version="$VERSION" -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -warnaserror
          fi
          if [ "$CLI" = true ] || [ "$DASHBOARD" = true ]; then
            dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r linux-x64 -o dist/linux/dashboard -p:Version="$VERSION" -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -warnaserror
          fi
          rm -f dist/linux/*/*.pdb
          if [ "$CLI" = true ]; then
            cp dist/linux/cli/dockyard-cli out/dockyard-linux-x64
            # setup links ~/.local/bin/dockyard to Dockyard/dockyard-cli.
            mkdir -p out/Dockyard
            cp dist/linux/cli/dockyard-cli dist/linux/tray/dockyard-tray dist/linux/tray/libSkiaSharp.so dist/linux/tray/libHarfBuzzSharp.so out/Dockyard/
            tar -czf "out/Dockyard-$VERSION-linux-x64.tar.gz" -C out Dockyard
            for packager in deb rpm; do nfpm dockyard "$packager"; done
          fi
          if [ "$DASHBOARD" = true ]; then
            mkdir -p out/dockyard-dashboard
            cp dist/linux/dashboard/dockyard-dashboard dist/linux/tray/dockyard-tray dist/linux/tray/libSkiaSharp.so dist/linux/tray/libHarfBuzzSharp.so out/dockyard-dashboard/
            tar -czf "out/dockyard-dashboard-$VERSION-linux-x64.tar.gz" -C out dockyard-dashboard
            for packager in deb rpm; do nfpm dockyard-dashboard "$packager"; done
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          if-no-files-found: ignore
          path: |
            out/dockyard-linux-x64
            out/Dockyard-*-linux-x64.tar.gz
            out/dockyard-dashboard-*-linux-x64.tar.gz
            out/*.deb
            out/*.rpm

  image:
    needs: [plan]
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and test the Linux engine image
        run: |
          version="${{ needs.plan.outputs.version }}"
          sh image/build.sh x86_64 "$version"
          pwsh image/test.ps1 -Tarball "out/dockyard-linux-$version-x86_64.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: out/dockyard-linux-*.tar.gz

  vm-image:
    needs: [plan]
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the aarch64 VM assets
        run: sh image/build.sh aarch64 "${{ needs.plan.outputs.version }}" vm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vm-image
          path: out/dockyard-vm-*-aarch64.tar.gz

  macos:
    needs: [plan, vm-image]
    if: ${{ !cancelled() && (needs.plan.outputs.cli == 'true' || needs.plan.outputs.dashboard == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          dotnet test --solution Dockyard.slnx --filter-not-trait "Category=Install"
          swift test --package-path macos/DockyardVM

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.vm-image.result == 'success'
        with:
          name: vm-image
          path: vm-image

      # A release without an engine bundles the VM of the latest engine release.
      - name: The engine's VM image
        if: needs.vm-image.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/component-assets.sh engine vm-image 'dockyard-vm-*-aarch64.tar.gz'

      - name: Publish and bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CLI: ${{ needs.plan.outputs.cli }}
        run: |
          mkdir -p out
          if [ "$CLI" = true ]; then
            dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r osx-arm64 -o dist/cli -p:Version="$VERSION" -warnaserror
            cp dist/cli/dockyard-cli out/dockyard-macos-arm64
          fi
          # The bundle is the dashboard's: the CLI is its own asset and is not inside.
          dotnet publish src/Dockyard.Tray/Dockyard.Tray.csproj -c Release -r osx-arm64 -o dist/macos -p:Version="$VERSION" -warnaserror
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r osx-arm64 -o dist/macos -p:Version="$VERSION" -warnaserror
          swift build -c release --package-path macos/DockyardVM
          cp macos/DockyardVM/.build/release/dockyard-host dist/macos/
          if [ "$CLI" = true ]; then
            # A plain signed file runs the VM outside a bundle, for a CLI without the dashboard.
            cp dist/macos/dockyard-host out/dockyard-host-macos-arm64
            codesign --force --sign - --entitlements macos/DockyardVM/dockyard-host.entitlements out/dockyard-host-macos-arm64
            codesign -d --entitlements - out/dockyard-host-macos-arm64 | grep -q com.apple.security.virtualization
          fi
          mkdir -p dist/macos/vm && tar -xzf vm-image/dockyard-vm-*-aarch64.tar.gz -C dist/macos/vm
          rm -f dist/macos/*.pdb
          sh packaging/macos/build-app.sh "$VERSION" dist/macos out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          if-no-files-found: ignore
          path: |
            out/Dockyard-*-macos*.zip
            out/Dockyard-*-macos*.dmg
            out/dockyard-macos-arm64
            out/dockyard-host-macos-arm64

  release-assets:
    needs: [plan, windows, linux, image, macos, vm-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Everything the one-liners and dockyard setup download is there
        run: |
          rm -f dist/*.png
          (cd dist && sha256sum -- * > SHA256SUMS)
          sh scripts/check-release-assets.sh "${{ needs.plan.outputs.component }}" "${{ needs.plan.outputs.version }}" "$(ls dist)"

  # A draft is invisible to releases/latest and to anyone downloading, so the one-liners keep getting the previous
  # release, with all its assets, until this one has all of its own. GitHub has one latest release per repository and the
  # download probe reads the CLI's files from it, so only the CLI's release takes it; each component's own latest is its
  # entry in components.json. The notes are the annotated tag's message, which the release skill writes.
  release:
    # Only a pushed tag publishes: install-tests.yml calls this workflow, also from a tag, and must never release.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.release-assets.result == 'success' && !contains(needs.*.result, 'failure') }}
    needs: [plan, windows, linux, image, macos, vm-image, release-assets]
    runs-on: ubuntu-latest
    concurrency:
      group: component-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # The setup test's screenshots are for looking at in the run, not for the release.
      - run: rm -f dist/*.png

      - name: Release every component
        if: needs.plan.outputs.component == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # Each component its own release, with the v tag's message as notes: the engine first, the CLI, whose setup
          # finds the others through components.json, last.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          for component in engine tray dashboard cli; do
            sh scripts/release-component.sh "$component" "$VERSION" "$RUNNER_TEMP/notes.md" dist
          done

      - if: needs.plan.outputs.component != 'all'
        run: (cd dist && sha256sum -- * > SHA256SUMS)

      - if: needs.plan.outputs.component != 'all'
        uses: ./.github/actions/upsert-release
        with:
          tag-prefix: ${{ needs.plan.outputs.component }}/
          title: ${{ needs.plan.outputs.component }} ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.prerelease }}
          latest: ${{ needs.plan.outputs.component == 'cli' }}
          token: ${{ github.token }}
          files: dist/*

      - if: needs.plan.outputs.component != 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/update-index.sh "${{ needs.plan.outputs.component }}" "${{ needs.plan.outputs.version }}"
