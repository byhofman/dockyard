name: dockyard
arch: amd64
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Thomas Hofman <noreply@github.com>
description: |
  Docker engine tray: installs Docker CE on demand, starts and stops it, and keeps it up to date.
homepage: https://github.com/byhofman/dockyard
license: MIT
contents:
  - src: dist/linux/tray/Dockyard
    dst: /usr/lib/dockyard/Dockyard
    file_info: { mode: 0755 }
  - src: /usr/lib/dockyard/Dockyard
    dst: /usr/bin/dockyard
    type: symlink
  - src: packaging/linux/dockyard.desktop
    dst: /usr/share/applications/dockyard.desktop
  - src: branding/app-icon/png/icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/dockyard.png
  - src: branding/app-icon/png/icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/dockyard.png
  - src: branding/app-icon/png/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/dockyard.png
  - src: branding/app-icon/png/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/dockyard.png
  - src: branding/app-icon/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dockyard.svg
scripts:
  postinstall: packaging/linux/postinstall.sh
