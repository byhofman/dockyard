name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        shell: pwsh
        run: dotnet test --solution Dockyard.slnx

      - name: Publish
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          dotnet publish src/Dockyard/Dockyard.csproj -c Release -r win-x64 -o out -p:Version=$version -warnaserror
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r win-x64 -o out/dashboard -p:Version=$version -warnaserror
          Compress-Archive -Path out/dashboard/*.exe, out/dashboard/*.dll -DestinationPath out/Dockyard.Dashboard.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/Dockyard.exe
            out/Dockyard.Dashboard.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --solution Dockyard.slnx

      - name: Publish
        run: |
          version=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Dockyard/Dockyard.csproj -c Release -r linux-x64 -o out/Dockyard -p:Version=$version -warnaserror
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r linux-x64 -o out/Dockyard -p:Version=$version -warnaserror
          rm -f out/Dockyard/*.pdb
          tar -czf "out/Dockyard-$version-linux-x64.tar.gz" -C out Dockyard

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/Dockyard-*-linux-x64.tar.gz

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the Linux engine image
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          ./image/build.ps1 -Arch x86_64 -Version $version
          ./image/test.ps1 -Tarball "out/dockyard-linux-$version-x86_64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: out/dockyard-linux-*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --solution Dockyard.slnx

      - name: Publish
        run: |
          version=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Dockyard/Dockyard.csproj -c Release -r osx-arm64 -o out/Dockyard -p:Version=$version -warnaserror
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r osx-arm64 -o out/Dockyard -p:Version=$version -warnaserror
          rm -f out/Dockyard/*.pdb
          (cd out && zip -qr "Dockyard-$version-osx-arm64.zip" Dockyard)

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/Dockyard-*-osx-arm64.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux, image, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" * --title "$GITHUB_REF_NAME" --generate-notes
