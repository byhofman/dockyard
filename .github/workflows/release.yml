name: build

# One workflow for every component. Pull requests and main build and test everything; a tag <component>/<version>
# builds, tests and releases only that component. See docs/design/components-and-releases.md.
on:
  push:
    branches: [main]
    tags: ['toolbox/*', 'dashboard/*', 'cli/*', 'engine/*']
  pull_request:

# Read only, except for the job that publishes the release.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.plan.outputs.component }}
      version: ${{ steps.plan.outputs.version }}
      toolbox: ${{ steps.plan.outputs.toolbox }}
      dashboard: ${{ steps.plan.outputs.dashboard }}
      cli: ${{ steps.plan.outputs.cli }}
      engine: ${{ steps.plan.outputs.engine }}
    steps:
      - id: plan
        run: |
          component=all; version=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then component="${GITHUB_REF_NAME%%/*}"; version="${GITHUB_REF_NAME#*/}"; fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for c in toolbox dashboard cli engine; do
            if [ "$component" = all ] || [ "$component" = "$c" ]; then echo "$c=true"; else echo "$c=false"; fi >> "$GITHUB_OUTPUT"
          done

  # The agent and scripts for an engine that already exists; the Toolbox carries them.
  guest:
    needs: [plan]
    if: needs.plan.outputs.toolbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sh image/build.sh x86_64 guest guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: guest
          path: out/dockyard-guest-*.tar.gz

  windows:
    needs: [plan, guest]
    if: ${{ !cancelled() && (needs.plan.outputs.engine != 'true' || needs.plan.outputs.component == 'all') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.toolbox == 'true'
        with:
          name: guest
          path: guest

      - name: Test
        shell: pwsh
        run: dotnet test --solution Dockyard.slnx

      - name: Toolbox
        if: needs.plan.outputs.toolbox == 'true'
        shell: pwsh
        run: dotnet publish src/Dockyard/Dockyard.csproj -c Release -r win-x64 -o out -p:Version=${{ needs.plan.outputs.version }} -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -warnaserror
          Copy-Item out/dockyard-toolbox.exe out/Dockyard.exe

      - name: Dashboard
        if: needs.plan.outputs.dashboard == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r win-x64 -o out/dashboard -p:Version=${{ needs.plan.outputs.version }} -warnaserror
          Compress-Archive -Path out/dashboard/*.exe, out/dashboard/*.dll -DestinationPath out/Dockyard.Dashboard.zip

      - name: CLI
        if: needs.plan.outputs.cli == 'true'
        shell: pwsh
        run: |
          dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r win-x64 -o out/cli -p:Version=${{ needs.plan.outputs.version }} -warnaserror
          Copy-Item out/cli/dockyard-cli.exe out/dockyard-windows-x64.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          if-no-files-found: ignore
          path: |
            out/Dockyard.exe
            out/Dockyard.Dashboard.zip
            out/dockyard-windows-x64.exe

  linux:
    needs: [plan, guest]
    if: ${{ !cancelled() && (needs.plan.outputs.engine != 'true' || needs.plan.outputs.component == 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.plan.outputs.toolbox == 'true'
        with:
          name: guest
          path: guest

      # The pinned kind, for the cluster tests on this runner's engine.
      - name: kind
        run: |
          kind_tag="v$(sed -n 's/^KIND=//p' image/versions.env)"
          url="https://github.com/kubernetes-sigs/kind/releases/download/$kind_tag/kind-linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/kind" "$url"
          echo "$(awk -v u="$url" '$2 == u { print $1 }' image/versions.sha256)  $RUNNER_TEMP/kind" | sha256sum -c
          chmod +x "$RUNNER_TEMP/kind"

      - name: Test
        env:
          DOCKYARD_TEST_ENDPOINT: unix:///var/run/docker.sock
        run: DOCKYARD_TEST_KIND="$RUNNER_TEMP/kind" dotnet test --solution Dockyard.slnx

      - name: Publish and package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TOOLBOX: ${{ needs.plan.outputs.toolbox }}
          DASHBOARD: ${{ needs.plan.outputs.dashboard }}
          CLI: ${{ needs.plan.outputs.cli }}
        run: |
          nfpm() {
            docker run --rm -v "$PWD:/work" -w /work -e VERSION="$VERSION" goreleaser/nfpm:v2.49.0@sha256:9ea46a59c4d055ef7071b22f3520b53e8dad98e18043b2f881b53bd7ffec634e \
              pkg --config "packaging/linux/$1.yaml" --packager "$2" --target out/
          }
          mkdir -p out
          # The Toolbox's package carries the dockyard command and its tarball the dashboard, until both are split out.
          if [ "$TOOLBOX" = true ] || [ "$DASHBOARD" = true ]; then
            dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r linux-x64 -o dist/linux/dashboard -p:Version="$VERSION" -warnaserror
          fi
          if [ "$TOOLBOX" = true ] || [ "$CLI" = true ]; then
            dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r linux-x64 -o dist/linux/cli -p:Version="$VERSION" -warnaserror
          fi
          if [ "$TOOLBOX" = true ]; then
            dotnet publish src/Dockyard/Dockyard.csproj -c Release -r linux-x64 -o dist/linux/tray -p:Version="$VERSION" -p:GuestBundle="$PWD/guest/dockyard-guest-guest-x86_64.tar.gz" -warnaserror
            rm -f dist/linux/*/*.pdb
            mkdir -p out/Dockyard && cp dist/linux/tray/* dist/linux/dashboard/* out/Dockyard/ && cp dist/linux/cli/dockyard-cli out/Dockyard/dockyard-cli
            cp dist/linux/tray/dockyard-toolbox out/Dockyard-linux-x64
            tar -czf "out/Dockyard-$VERSION-linux-x64.tar.gz" -C out Dockyard
            for packager in deb rpm; do nfpm dockyard "$packager"; done
          fi
          if [ "$DASHBOARD" = true ]; then
            rm -f dist/linux/dashboard/*.pdb
            for packager in deb rpm; do nfpm dockyard-dashboard "$packager"; done
          fi
          if [ "$CLI" = true ]; then cp dist/linux/cli/dockyard-cli out/dockyard-linux-x64; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          if-no-files-found: ignore
          path: |
            out/Dockyard-*-linux-x64.tar.gz
            out/Dockyard-linux-x64
            out/dockyard-linux-x64
            out/*.deb
            out/*.rpm

  image:
    needs: [plan]
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build and test the Linux engine image
        run: |
          version="${{ needs.plan.outputs.version }}"
          sh image/build.sh x86_64 "$version"
          pwsh image/test.ps1 -Tarball "out/dockyard-linux-$version-x86_64.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: out/dockyard-linux-*.tar.gz

  vm-test:
    needs: [plan]
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Boot the VM image with QEMU/KVM
        run: |
          sudo chmod 666 /dev/kvm
          sh image/build.sh x86_64 0.0.0 vm
          kind_tag="v$(sed -n 's/^KIND=//p' image/versions.env)"
          kind_sha="$(awk -v u="https://github.com/kubernetes-sigs/kind/releases/download/$kind_tag/kind-linux-amd64" '$2 == u { print $1 }' image/versions.sha256)"
          docker run --rm --device /dev/kvm -e KIND_TAG="$kind_tag" -e KIND_SHA256="$kind_sha" -v "$PWD/image/test-vm.sh:/test-vm.sh:ro" -v "$PWD/out:/out:ro" alpine:3.24 \
            sh /test-vm.sh /out/dockyard-vm-0.0.0-x86_64.tar.gz

  vm-image:
    needs: [plan]
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the aarch64 VM assets
        run: sh image/build.sh aarch64 "${{ needs.plan.outputs.version }}" vm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vm-image
          path: out/dockyard-vm-*-aarch64.tar.gz

  macos:
    needs: [plan, vm-image]
    if: ${{ !cancelled() && (needs.plan.outputs.toolbox == 'true' || needs.plan.outputs.cli == 'true') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          dotnet test --solution Dockyard.slnx
          swift test --package-path macos/DockyardVM

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.vm-image.result == 'success'
        with:
          name: vm-image
          path: vm-image

      # A Toolbox release bundles the VM of the latest engine release.
      - name: The engine's VM image
        if: needs.vm-image.result != 'success' && needs.plan.outputs.toolbox == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/component-assets.sh engine vm-image 'dockyard-vm-*-aarch64.tar.gz'

      - name: Publish and bundle
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          dotnet publish src/Dockyard.Cli/Dockyard.Cli.csproj -c Release -r osx-arm64 -o dist/cli -p:Version="$VERSION" -warnaserror
          mkdir -p out
          if [ "${{ needs.plan.outputs.cli }}" = true ]; then cp dist/cli/dockyard-cli out/dockyard-macos-arm64; fi
          if [ "${{ needs.plan.outputs.toolbox }}" = true ]; then
            dotnet publish src/Dockyard/Dockyard.csproj -c Release -r osx-arm64 -o dist/macos -p:Version="$VERSION" -warnaserror
            dotnet publish src/Dockyard.Dashboard/Dockyard.Dashboard.csproj -c Release -r osx-arm64 -o dist/macos -p:Version="$VERSION" -warnaserror
            cp dist/cli/dockyard-cli dist/macos/dockyard-cli
            swift build -c release --package-path macos/DockyardVM
            cp macos/DockyardVM/.build/release/dockyard-vm dist/macos/
            mkdir -p dist/macos/vm && tar -xzf vm-image/dockyard-vm-*-aarch64.tar.gz -C dist/macos/vm
            rm -f dist/macos/*.pdb
            sh packaging/macos/build-app.sh "$VERSION" dist/macos out
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          if-no-files-found: ignore
          path: |
            out/Dockyard-*-macos*.zip
            out/Dockyard-*-macos*.dmg
            out/dockyard-macos-arm64

  wizard-windows:
    needs: [plan, windows, image]
    if: ${{ !cancelled() && needs.plan.outputs.toolbox == 'true' && needs.windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows
          path: wizard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.image.result == 'success'
        with:
          name: image
          path: wizard
      - name: The engine's image and the dashboard and CLI of their latest releases
        if: needs.plan.outputs.component == 'toolbox'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/component-assets.sh engine wizard 'dockyard-linux-*-x86_64.tar.gz'
          sh scripts/component-assets.sh dashboard wizard Dockyard.Dashboard.zip
          sh scripts/component-assets.sh cli wizard dockyard-windows-x64.exe

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install, update, add and remove on a real Windows runner with WSL 2
        shell: pwsh
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
          DOCKYARD_SOURCE: ${{ github.workspace }}
        run: ./tests/e2e/wizard-windows.ps1 -Wizard wizard/Dockyard.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wizard-screenshots
          path: screenshots

  wizard-mac:
    needs: [plan, macos]
    if: ${{ !cancelled() && needs.plan.outputs.toolbox == 'true' && needs.macos.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos
          path: wizard

      # Apple-silicon runners have no nested virtualization, so the VM itself is booted on a real Mac; see tests/e2e/wizard-mac.sh.
      - name: Install, update and remove with a real administrator
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: ADMIN=1 WIZARD_ZIP="$(ls wizard/Dockyard-*-macos.zip)" sh tests/e2e/wizard-mac.sh

  wizard-linux:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.plan.outputs.toolbox == 'true' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux
          path: wizard

      - name: On this runner, with systemd and sudo
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x wizard/Dockyard-linux-x64
          WIZARD="$PWD/wizard/Dockyard-linux-x64" sh tests/e2e/wizard-linux.sh

      - name: Import from a second engine that plays Docker Desktop
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$PWD/wizard/Dockyard-linux-x64" --silent --no-start --assets "$PWD/wizard"
          WIZARD="$PWD/wizard/Dockyard-linux-x64" sh tests/e2e/import-linux.sh
          "$PWD/wizard/Dockyard-linux-x64" --silent --uninstall

      - name: Behind ufw and firewalld
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: WIZARD="$PWD/wizard/Dockyard-linux-x64" sh tests/e2e/firewall-linux.sh

      - name: In containers, as root and refused without root
        env:
          DOCKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo systemctl start docker.socket
          # After the uninstalls above, containers must reach the network with nothing of Dockyard's in the way.
          if ! timeout 60 sudo docker run --rm alpine:3.24 nslookup dl-cdn.alpinelinux.org; then
            cat /etc/docker/daemon.json || true; cat /etc/resolv.conf /run/systemd/resolve/resolv.conf || true
            sudo docker run --rm alpine:3.24 cat /etc/resolv.conf || true
            resolvectl status | head -30 || true; sudo iptables -S | head -40 || true; sudo iptables -t nat -S | head -40 || true; ip addr show lo; ip route; systemctl status --no-pager docker.service | tail -5
            exit 1
          fi
          for image in fedora:43 archlinux:latest debian:13; do
            echo "::group::$image"
            sudo docker run --rm -e DOCKYARD_GITHUB_TOKEN -e WIZARD=/wizard/Dockyard-linux-x64 -v "$PWD/wizard:/wizard:ro" -v "$PWD/tests/e2e:/e2e:ro" "$image" sh /e2e/wizard-linux.sh --container
            echo "::endgroup::"
          done

  release-assets:
    needs: [plan, windows, linux, image, macos, vm-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: The dashboard's assets that ride along with a Toolbox release
        if: needs.plan.outputs.component == 'toolbox'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/component-assets.sh dashboard dist Dockyard.Dashboard.zip 'dockyard-dashboard_*_amd64.deb' 'dockyard-dashboard-*-1.x86_64.rpm'
      - name: Everything the one-liners and the Toolbox download is there
        run: |
          rm -f dist/*.png
          (cd dist && sha256sum -- * > SHA256SUMS)
          sh scripts/check-release-assets.sh "${{ needs.plan.outputs.component }}" "${{ needs.plan.outputs.version }}" "$(ls dist)"

  # A draft is invisible to releases/latest and to anyone downloading, so the one-liners keep getting the previous
  # release, with all its assets, until this one has all of its own. Only the Toolbox's release becomes the latest;
  # the others are found through components.json.
  release:
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.release-assets.result == 'success' && !contains(needs.*.result, 'failure') }}
    needs: [plan, windows, linux, image, vm-test, macos, vm-image, wizard-windows, wizard-linux, wizard-mac, release-assets]
    runs-on: ubuntu-latest
    concurrency:
      group: component-index
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ needs.plan.outputs.component }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # The wizard's screenshots are for looking at in the run, not for the release.
          rm -f dist/*.png
          if [ "$COMPONENT" = toolbox ]; then
            sh scripts/component-assets.sh dashboard dist Dockyard.Dashboard.zip 'dockyard-dashboard_*_amd64.deb' 'dockyard-dashboard-*-1.x86_64.rpm'
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          # The release notes are the annotated tag's message.
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$COMPONENT $VERSION" --notes-from-tag
          gh release upload "$GITHUB_REF_NAME" dist/*
          sh scripts/check-release-assets.sh "$COMPONENT" "$VERSION" "$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          if [ "$COMPONENT" = toolbox ]; then latest=--latest; else latest=--latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "$latest"
          sh scripts/update-index.sh "$COMPONENT" "$VERSION"
